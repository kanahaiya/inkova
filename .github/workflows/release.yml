name: Production Release Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v0.1.1)'
        required: false
        default: 'v0.1.1'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build Inkova Windows EXE & Installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Prepare Standalone Portable & Generate SHA-256 Checksums
        shell: pwsh
        run: |
          Copy-Item "src-tauri/target/release/inkova.exe" -Destination "src-tauri/target/release/Inkova-Portable.exe"
          $files = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe", "src-tauri/target/release/bundle/msi/*.msi", "src-tauri/target/release/Inkova-Portable.exe" -ErrorAction SilentlyContinue
          $hashes = foreach ($f in $files) {
            $h = Get-FileHash -Path $f.FullName -Algorithm SHA256
            "$($h.Hash.ToLower())  $($f.Name)"
          }
          $hashes | Out-File -FilePath "src-tauri/target/release/SHA256SUMS.txt" -Encoding ascii

      - name: Upload Windows Installers and Executable
        uses: actions/upload-artifact@v4
        with:
          name: Inkova-Windows-Release
          path: |
            src-tauri/target/release/Inkova-Portable.exe
            src-tauri/target/release/SHA256SUMS.txt
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.zip
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/latest.json
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/Inkova-Portable.exe
            src-tauri/target/release/SHA256SUMS.txt
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.zip
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/latest.json
          name: Inkova ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
